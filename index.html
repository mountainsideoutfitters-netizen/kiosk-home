<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Customer Kiosk</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }

  h1 {
    font-size: 48px;
    margin-bottom: 15px;
  }

  p {
    font-size: 26px;
    margin-bottom: 50px;
  }

  .buttons {
    display: flex;
    gap: 30px;
    justify-content: center;
  }

  a {
    width: 350px;
    height: 220px;
    border-radius: 25px;
    background: white;
    border: 4px solid #222;
    text-decoration: none;
    color: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(0,0,0,.15);
    padding: 15px;
    box-sizing: border-box;
  }

  a:active {
    transform: scale(.97);
  }

  .logo {
    max-width: 300px;
    max-height: 145px;
    object-fit: contain;
    margin-bottom: 10px;
  }

  .credova {
    font-size: 50px;
    font-weight: bold;
    letter-spacing: -2px;
    margin-bottom: 20px;
  }

  .label {
    font-size: 24px;
    font-weight: bold;
    text-align: center;
  }
</style>
</head>

<body>

<h1>Welcome</h1>
<p>Please select a website</p>

<div class="buttons">

  <a href="https://www.silencershop.com">
    <img class="logo"
         src="Silencer_Shop_Logo.jpg"
         alt="Silencer Shop">
    <div class="label">Silencer Shop</div>
  </a>

  <a href="https://www.mountainsideoutfitters.com">
    <img class="logo"
         src="Mountainside's Color Logo - Updated 11-09-22.png"
         alt="Mountainside Outfitters">
    <div class="label">Mountainside Outfitters</div>
  </a>

  <a href="https://lending.credova.com/Apply/Identification">
    <div class="credova">credova</div>
    <div class="label">Apply for Financing</div>
  </a>

</div>

</body>
</html>
