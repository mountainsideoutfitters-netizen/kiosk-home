<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Customer Kiosk</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }

  h1 {
    font-size: 48px;
    margin-bottom: 15px;
  }

  p {
    font-size: 26px;
    margin-bottom: 50px;
  }

  .buttons {
    display: flex;
    gap: 50px;
  }

  a {
    width: 400px;
    height: 220px;
    border-radius: 25px;
    background: white;
    border: 4px solid #222;
    text-decoration: none;
    color: #111;
    font-size: 34px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0,0,0,.15);
  }

  a:active {
    transform: scale(.97);
  }
</style>
</head>

<body>

<h1>Welcome</h1>
<p>Please select a website</p>

<div class="buttons">

<a href="https://www.silencershop.com">
Silencer Shop
</a>

<a href="https://www.mountainsideoutfitters.com">
Mountainside<br>Outfitters
</a>

</div>

</body>
</html>
